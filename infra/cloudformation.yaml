AWSTemplateFormatVersion: '2010-09-09'
Description: >
  English Flashcards — full application stack: an S3 + CloudFront static site, a Cognito user pool
  (admin-invite-only) with a hosted-UI app client, a Regional REST API (API Gateway) authorized by
  Cognito, a Lambda progress function, a DynamoDB progress table, CloudWatch logs, and alarms.
  The API tier uses a Regional REST API (not HTTP API) by design.

  PREREQUISITES (not created by this template):
    * An S3 artifacts bucket (CodeBucketName) containing the Lambda zip at CodeKey.
    * An IAM permissions-boundary policy whose ARN is passed as PermissionsBoundaryArn
      (see infra/README.md and infra/boundary.example.json).
  This template is therefore NOT fully self-contained; satisfy the prerequisites first.

# Resources whose names must be globally/account unique (buckets, Cognito domain) are parameterized.
# Review and adjust names/Regions for your account before deploying.

Parameters:
  SiteBucketName: { Type: String, Default: english-flashcards-site, AllowedPattern: '^english-flashcards-[a-z0-9-]+$' }
  CodeBucketName: { Type: String, Default: english-flashcards-artifacts, AllowedPattern: '^english-flashcards-[a-z0-9-]+$' }
  CodeKey: { Type: String, Description: S3 key of the rebuilt Lambda zip }
  # No default: the Cognito hosted-UI domain prefix must be globally unique. Supply your own,
  # e.g. english-flashcards-<your-account-id> or any available prefix.
  CognitoDomainPrefix: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9-]{2,62}$', Description: Globally-unique Cognito hosted-UI domain prefix }
  # No default: email that receives the operational SNS alarm notifications.
  AlarmEmail: { Type: String, AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', Description: Email address subscribed to the CloudWatch alarm SNS topic }
  # PREREQUISITE, NOT created by this stack. The ARN of an IAM permissions boundary policy that
  # the Lambda execution role is created under. See infra/README.md and infra/boundary.example.json.
  PermissionsBoundaryArn: { Type: String, AllowedPattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+$', Description: ARN of a pre-existing IAM permissions boundary policy (see infra/README.md) }

Resources:

  # ===== storage / data / auth =====
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [ { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } } ] }
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls: { Rules: [ { ObjectOwnership: BucketOwnerEnforced } ] }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-noncurrent-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 30 } }
          - { Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 } }
      Tags: [ { Key: project, Value: english-flashcards } ]

  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: english-flashcards-progress
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      AttributeDefinitions: [ { AttributeName: userId, AttributeType: S } ]
      KeySchema: [ { AttributeName: userId, KeyType: HASH } ]
      Tags: [ { Key: project, Value: english-flashcards } ]

  ProgressLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { LogGroupName: /aws/lambda/english-flashcards-progress, RetentionInDays: 30 }

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: english-flashcards-users
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameAttributes: [ email ]
      AutoVerifiedAttributes: [ email ]
      AccountRecoverySetting: { RecoveryMechanisms: [ { Name: verified_email, Priority: 1 } ] }
      Policies: { PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false } }
      UserPoolTags: { project: english-flashcards }

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool          ### REST-DELTA referenced via !Ref, not a hard-coded id
      Identifier: english-flashcards
      Name: english-flashcards
      Scopes: [ { ScopeName: progress, ScopeDescription: Read and write your own study progress } ]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: english-flashcards-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [ code ]
      AllowedOAuthScopes: [ openid, email, english-flashcards/progress ]
      SupportedIdentityProviders: [ COGNITO ]
      CallbackURLs: [ !Sub 'https://${Distribution.DomainName}/' ]
      LogoutURLs: [ !Sub 'https://${Distribution.DomainName}/' ]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: { Domain: !Ref CognitoDomainPrefix, UserPoolId: !Ref UserPool }

  # ===== Lambda (unchanged business logic; handler now accepts REST + HTTP events) =====
  ProgressFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: english-flashcards-progress-fn-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [ { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole } ]
      Policies:
        - PolicyName: english-flashcards-progress-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [ dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem ], Resource: !GetAtt ProgressTable.Arn }
              - { Effect: Allow, Action: cognito-idp:AdminDeleteUser, Resource: !GetAtt UserPool.Arn }
              - { Effect: Allow, Action: [ logs:CreateLogStream, logs:PutLogEvents ], Resource: !GetAtt ProgressLogGroup.Arn }
      Tags: [ { Key: project, Value: english-flashcards } ]

  ProgressFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: english-flashcards-progress
      Runtime: python3.14
      Architectures: [ arm64 ]
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt ProgressFunctionRole.Arn
      Code: { S3Bucket: !Ref CodeBucketName, S3Key: !Ref CodeKey }
      Environment: { Variables: { TABLE_NAME: !Ref ProgressTable, USER_POOL_ID: !Ref UserPool } }
      LoggingConfig: { LogGroup: !Ref ProgressLogGroup }
      Tags: [ { Key: project, Value: english-flashcards } ]

  # ===== REST-DELTA: Regional REST API replaces all ApiGatewayV2 resources =====
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: english-flashcards-api
      EndpointConfiguration: { Types: [ REGIONAL ] }
      Tags: [ { Key: project, Value: english-flashcards } ]

  ApiResource:                          # /api
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: api }

  ProgressResource:                     # /api/progress
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref RestApi, ParentId: !Ref ApiResource, PathPart: progress }
  AccountResource:                      # /api/account
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref RestApi, ParentId: !Ref ApiResource, PathPart: account }

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: english-flashcards-cognito
      RestApiId: !Ref RestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [ !GetAtt UserPool.Arn ]   # reuse imported pool via !GetAtt, not a literal id

  # Explicit methods only — no ANY route. Each is Cognito-authorized with the progress scope.
  GetProgressMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProgressResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [ english-flashcards/progress ]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProgressFunction.Arn}/invocations'
      MethodResponses: [ { StatusCode: '200' } ]
  PutProgressMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProgressResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [ english-flashcards/progress ]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProgressFunction.Arn}/invocations'
      MethodResponses: [ { StatusCode: '200' } ]
  DeleteAccountMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AccountResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [ english-flashcards/progress ]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProgressFunction.Arn}/invocations'
      MethodResponses: [ { StatusCode: '200' } ]
  ProgressOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProgressResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":200}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'authorization,content-type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${Distribution.DomainName}'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
  AccountOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AccountResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":200}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'authorization,content-type'"
              method.response.header.Access-Control-Allow-Methods: "'DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${Distribution.DomainName}'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProgressFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'

  # The logical ID embeds a config revision (CONFIG_REV). DependsOn only orders creation; it does
  # NOT redeploy on change. Bumping CONFIG_REV (vNNN) when methods/integration change creates a NEW
  # Deployment resource, which the stage then references — the supported CFN redeploy mechanism.
  Deploymentv001:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ GetProgressMethod, PutProgressMethod, DeleteAccountMethod, ProgressOptions, AccountOptions ]
    Properties:
      RestApiId: !Ref RestApi
      Description: eflash REST deployment (config rev 001)

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deploymentv001
      StageName: prod
      Tags: [ { Key: project, Value: english-flashcards } ]   # REST stage tagging uses verb actions, not the HTTP-API-only failing path

  # ===== CloudFront: /api/* behavior now targets the REST invoke URL with OriginPath=/prod =====
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties: { OriginAccessControlConfig: { Name: english-flashcards-oac, OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 } }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [ { Key: project, Value: english-flashcards } ]
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api                       ### REST-DELTA: REST invoke host + stage in OriginPath
            DomainName: !Sub '${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            OriginPath: /prod             # so browser /api/progress -> origin /prod/api/progress
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [ TLSv1.2 ] }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - { PathPattern: /assets/*, TargetOriginId: site, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 }
          - { PathPattern: /audio/*, TargetOriginId: site, ViewerProtocolPolicy: redirect-to-https, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 }
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [ GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE ]
            CachedMethods: [ GET, HEAD ]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [ !GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*' ]
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: english-flashcards-alarms, Subscription: [ { Protocol: email, Endpoint: !Ref AlarmEmail } ], Tags: [ { Key: project, Value: english-flashcards } ] }

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: english-flashcards-lambda-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [ { Name: FunctionName, Value: !Ref ProgressFunction } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: english-flashcards-api-5xx     ### REST-DELTA: ApiName dimension is the REST API name
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions: [ { Name: ApiName, Value: english-flashcards-api } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

Outputs:
  SiteURL: { Value: !Sub 'https://${Distribution.DomainName}' }
  RestApiId: { Value: !Ref RestApi }
  ApiInvokeUrl: { Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod' }
  UserPoolId: { Value: !Ref UserPool }
